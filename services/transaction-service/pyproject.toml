[project]
name = "transaction-service"
version = "0.1.0"
description = "Transaction lifecycle and workflow orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "riskgate-contracts",
    "riskgate-shared-observability",
]

[dependency-groups]
dev = ["riskgate-test-utilities"]

[tool.uv.sources]
riskgate-contracts = { workspace = true }
riskgate-shared-observability = { workspace = true }
riskgate-test-utilities = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transaction_service"]
