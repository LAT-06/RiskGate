[project]
name = "riskgate-contracts"
version = "0.1.0"
description = "Shared identifiers, API schemas, and event schemas"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskgate_contracts"]
