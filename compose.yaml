x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: infrastructure/docker/service.Dockerfile
  env_file: .env
  restart: unless-stopped

services:
  banking-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: { SERVICE: banking-service }
    ports: ["8001:8000"]
    environment:
      LEDGER_SERVICE_URL: http://ledger-service:8000

  transaction-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: { SERVICE: transaction-service }
    ports: ["8002:8000"]

  ledger-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: { SERVICE: ledger-service }
    ports: ["8003:8000"]

  risk-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: { SERVICE: risk-service }
    ports: ["8004:8000"]

  investigation-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: { SERVICE: investigation-service }
    ports: ["8005:8000"]
